name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android --org com.voicenest --project-name voicenest .
      - run: |
          cp src/main.dart lib/main.dart
          cp src/pubspec.yaml pubspec.yaml
          sed -i 's/flutter.minSdkVersion/24/' android/app/build.gradle*
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          names=['INTERNET','RECORD_AUDIO','MODIFY_AUDIO_SETTINGS','CHANGE_NETWORK_STATE','BLUETOOTH','BLUETOOTH_CONNECT','WAKE_LOCK']
          perms=''.join('<uses-permission android:name="android.permission.%s"/>'%n for n in names)
          s=s.replace('<application',perms+'<application',1)
          s=s.replace('android:label="voicenest"','android:label="VoiceNest"')
          open(p,'w').write(s)
          PY
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: voicenest-apk
          path: build/app/outputs/flutter-apk/app-release.apk
